name: FacetLine hourly autopilot

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: "Run read-only provider credential checks; do not generate or publish stories"
        required: false
        default: false
        type: boolean

concurrency:
  group: facetline-autopilot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout public catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check cloud secrets are configured
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" || -z "$OPENROUTER_API_KEY" || -z "$GOOGLE_API_KEY" ]]; then
            echo "Cloud secrets are not configured yet; this scheduled run is safely skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify provider credentials without generating content
        if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only && steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_FREE_TIER_CONFIRMED: "true"
        run: python .github/scripts/key_diagnostics.py

      - name: Restore private worker workspace
        id: workspace
        if: ${{ steps.preflight.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.diagnostics_only) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          mkdir -p worker-runtime
          python .github/scripts/cloud_workspace.py download --root worker-runtime

      - name: Seed worker with the current public catalog
        if: ${{ steps.preflight.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.diagnostics_only) }}
        run: |
          mkdir -p worker-runtime/dist/public
          for path in manifest.json stories media challenges; do
            if [[ -e "$path" ]]; then
              cp -a "$path" worker-runtime/dist/public/
            fi
          done
          test -s worker-runtime/dist/public/manifest.json

      - name: Install worker dependencies
        if: steps.workspace.outcome == 'success'
        run: python -m pip install -r worker-runtime/requirements.txt

      - name: Discover, verify, and publish up to five stories
        if: steps.workspace.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_FREE_TIER_CONFIRMED: "true"
          WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python worker-runtime/daily_worker.py tick

      - name: Save private worker workspace
        if: always() && steps.preflight.outputs.ready == 'true' && steps.workspace.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python .github/scripts/cloud_workspace.py upload --root worker-runtime
